name: PR Conventional Commit

on:
  workflow_dispatch:
    # Automatic runs disabled for this standalone private fork.

jobs:
  validate-pr-title:
    if: ${{ github.repository == 'immich-app/immich' }}
    name: Validate PR Title (conventional commit)
    uses: immich-app/devtools/.github/workflows/shared-pr-require-conventional-commit.yml@f852dea251d00397830d83977184b6551e84589c # main
    permissions:
      pull-requests: write

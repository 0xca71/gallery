name: Custom Docker

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feat/**'

concurrency:
  group: custom-docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/gallery-server

jobs:
  server:
    name: Build and push Gallery server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Apply Gallery branding
        uses: ./.github/actions/apply-branding
        with:
          version: v5.7.0-custom

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Login to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          ref_tag="${GITHUB_REF_NAME//\//-}"
          build_tag="$(TZ=Asia/Shanghai date '+build-%Y%m%d-%H%M%S-utc8')"

          {
            echo 'value<<EOF'
            echo "${IMAGE}:${ref_tag}"
            echo "${IMAGE}:commit-${GITHUB_SHA}"
            echo "${IMAGE}:${build_tag}"
            if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
              echo "${IMAGE}:latest"
            fi
            echo EOF
          } >> "${GITHUB_OUTPUT}"

          echo "Build tags:"
          cat "${GITHUB_OUTPUT}"

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.value }}
          build-args: |
            DEVICE=cpu
            BUILD_ID=${{ github.run_id }}
            BUILD_IMAGE=${{ env.IMAGE }}
            BUILD_SOURCE_REF=${{ github.ref_name }}
            BUILD_SOURCE_COMMIT=${{ github.sha }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha,scope=custom-gallery-server-amd64
          cache-to: type=gha,scope=custom-gallery-server-amd64,mode=max
